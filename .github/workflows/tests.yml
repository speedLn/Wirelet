name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m pyflakes wirelet/*.py wirelet/crypto wirelet/network wirelet/model wirelet/actions wirelet/schema/core.py wirelet/schema/__init__.py compiler tests examples
      - name: Test
        run: python -m pytest -q
