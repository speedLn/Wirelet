[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "wirelet"
dynamic = ["version"]
description = "A modern MTProto framework for Telegram bots and user accounts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "speedLn" }]
keywords = ["telegram", "mtproto", "bot", "userbot", "api", "asyncio", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
fast = ["tgcrypto>=1.2.5"]
proxy = ["python-socks[asyncio]>=2.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyflakes"]

[project.urls]
Homepage = "https://github.com/speedLn/Wirelet"
Source = "https://github.com/speedLn/Wirelet"
Issues = "https://github.com/speedLn/Wirelet/issues"

[tool.hatch.version]
path = "wirelet/__init__.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
# Generated at build time from compiler/schema, so git ignores them.
artifacts = [
    "wirelet/schema/registry.py",
    "wirelet/schema/kinds/",
    "wirelet/schema/objects/",
    "wirelet/schema/methods/",
]

[tool.hatch.build.targets.wheel]
packages = ["wirelet"]

[tool.hatch.build.targets.sdist]
include = ["wirelet", "compiler", "tests", "examples", "hatch_build.py", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
